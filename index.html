<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gospel Show | Gate Scanner</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  overscroll-behavior-x: none;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #0b1c2d;
}

/* APP WRAPPER */
.app {
  max-width: 420px;
  width: 100%;
  height: 100vh;
  margin: 0 auto;
  background: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  inset: 0;
}

/* HEADER */
.header {
  height: 48px;
  background: linear-gradient(135deg,#0b1c2d,#102a43);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .3px;
}

/* CAMERA */
.camera-box {
  position: relative;
  width: 100%;
  height: 52vh;
  background: #000;
  overflow: hidden;
}

#reader {
  width: 100%;
  height: 100%;
}

/* OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  color: #fff;
}

.overlay.valid { background: rgba(25,135,84,.9); }
.overlay.used { background: rgba(255,193,7,.9); color:#000; }
.overlay.invalid { background: rgba(220,53,69,.9); }

/* BOTTOM PANEL */
.panel {
  flex: 1;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #fff;
}

/* STATS */
.stats {
  display: flex;
  gap: 6px;
}

.stat {
  flex: 1;
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

.stat span {
  display: block;
  font-size: 18px;
  margin-top: 2px;
}

.verified { background:#e6f4ea; color:#198754; }
.rejected { background:#fdecea; color:#dc3545; }
.vip { background:#e7f1ff; color:#0d6efd; }

/* FLASH */
.flash {
  margin-top: 8px;
  width: 100%;
  height: 44px;
  border-radius: 12px;
  border: none;
  background: #0b1c2d;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    🎟️ Gospel Show — Gate Scanner
  </div>

  <div class="camera-box">
    <div id="reader"></div>
    <div id="overlay" class="overlay"></div>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat verified">Verified<span id="ok">0</span></div>
      <div class="stat rejected">Rejected<span id="bad">0</span></div>
      <div class="stat vip">VIP<span id="vip">0</span></div>
    </div>

    <button class="flash" onclick="toggleFlash()">
      <i class="fa-solid fa-bolt"></i> Flashlight
    </button>
  </div>

</div>

<script>
/* SUPABASE */
const SUPABASE_URL = "https://nsmzfsbweutysbdhgjec.supabase.co";
const SUPABASE_KEY = "sb_publishable_bEvuBN_PM3UdX1ferXyQkg_tR97hhN7";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* VOICE */
function speak(text){
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 0.85;
  speechSynthesis.speak(msg);
}

/* OVERLAY */
const overlay = document.getElementById("overlay");
function show(type,text){
  overlay.className = "overlay " + type;
  overlay.innerHTML = text;
  overlay.style.display = "flex";
  setTimeout(()=>overlay.style.display="none",2200);
}

/* COUNTERS */
let ok=0,bad=0,vip=0;
const okEl=document.getElementById("ok");
const badEl=document.getElementById("bad");
const vipEl=document.getElementById("vip");

/* SCANNER */
let scanningLocked=false;
let track,torch=false;

const qr = new Html5Qrcode("reader");
qr.start(
  { facingMode:"environment" },
  { fps:10, qrbox:220 },
  async txt=>{
    if(scanningLocked) return;
    scanningLocked=true;

    const {data,error} = await supabaseClient
      .rpc("scan_ticket",{ qr_code: txt });

    if(error || !data){
      bad++; badEl.textContent=bad;
      show("invalid","INVALID");
      speak("Invalid Ticket");
      setTimeout(()=>scanningLocked=false,2500);
      return;
    }

    if(data.status==="valid"){
      ok++; okEl.textContent=ok;
      if(data.ticket_type==="VIP"){ vip++; vipEl.textContent=vip; }
      show("valid","ACCESS GRANTED");
      speak("Access Granted");
    }
    else if(data.status==="used"){
      bad++; badEl.textContent=bad;
      show("used","ALREADY USED");
      speak("Ticket Already Used");
    }
    else{
      bad++; badEl.textContent=bad;
      show("invalid","ACCESS DENIED");
      speak("Access Denied");
    }

    setTimeout(()=>scanningLocked=false,3000);
  }
).then(()=>{
  track=document.querySelector("video").srcObject.getVideoTracks()[0];
});

/* FLASH */
function toggleFlash(){
  if(!track) return;
  torch=!torch;
  track.applyConstraints({ advanced:[{ torch }] });
}
</script>

</body>
</html>
