<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gospel Show | Gate Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(135deg,#0b1c2d,#102a43);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: #fff;
  max-width: 460px;
  width: 100%;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 30px 60px rgba(0,0,0,.4);
  text-align: center;
}

h2 {
  margin: 0 0 12px;
}

/* CAMERA */
.camera-box {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #ddd;
}

.overlay {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
  text-align: center;
  color: #fff;
}

.overlay.valid { background: rgba(25,135,84,.85); }
.overlay.used { background: rgba(255,193,7,.85); color:#000; }
.overlay.invalid { background: rgba(220,53,69,.85); }

/* COUNTERS */
.stats {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
}

.stat {
  flex: 1;
  margin: 0 4px;
  padding: 10px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
}

.verified { background:#e6f4ea; color:#198754; }
.rejected { background:#fdecea; color:#dc3545; }
.vip { background:#e7f1ff; color:#0d6efd; }

button.flash {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: #0b1c2d;
  color: #fff;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

  <h2>Ticket Scanner</h2>

  <div class="camera-box">
    <div id="reader"></div>
    <div id="overlay" class="overlay"></div>
  </div>

  <button class="flash" onclick="toggleFlash()">
    <i class="fa-solid fa-bolt"></i> Flashlight
  </button>

  <div class="stats">
    <div class="stat verified">
      Verified<br><span id="ok">0</span>
    </div>
    <div class="stat rejected">
      Rejected<br><span id="bad">0</span>
    </div>
    <div class="stat vip">
      VIP<br><span id="vip">0</span>
    </div>
  </div>

</div>

<script>
/* SUPABASE CONFIG */
const SUPABASE_URL = "https://nsmzfsbweutysbdhgjec.supabase.co";
const SUPABASE_KEY = "sb_publishable_bEvuBN_PM3UdX1ferXyQkg_tR97hhN7";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* VOICE */
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 0.9;
  msg.pitch = 1;
  speechSynthesis.speak(msg);
}

/* OVERLAY */
const overlay = document.getElementById("overlay");

function show(type, text) {
  overlay.className = "overlay " + type;
  overlay.innerHTML = text;
  overlay.style.display = "flex";
  setTimeout(() => overlay.style.display = "none", 2000);
}

/* COUNTERS */
let ok = 0, bad = 0, vip = 0;
const okEl = document.getElementById("ok");
const badEl = document.getElementById("bad");
const vipEl = document.getElementById("vip");

/* SCANNER */
let qr, track, torch = false;

qr = new Html5Qrcode("reader");
qr.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  async (txt) => {

    const { data, error } = await supabaseClient
      .rpc("scan_ticket", { qr_code: txt });

    if (error || !data) {
      bad++; badEl.textContent = bad;
      show("invalid", "INVALID");
      speak("Invalid Ticket");
      return;
    }

    if (data.status === "valid") {
      ok++; okEl.textContent = ok;

      if (data.ticket_type === "VIP") {
        vip++; vipEl.textContent = vip;
      }

      show("valid", "ACCESS GRANTED");
      speak("Access Granted");
    }
    else if (data.status === "used") {
      bad++; badEl.textContent = bad;
      show("used", "ALREADY USED");
      speak("Ticket Already Used");
    }
    else {
      bad++; badEl.textContent = bad;
      show("invalid", "ACCESS DENIED");
      speak("Access Denied");
    }
  }
).then(() => {
  track = document.querySelector("video").srcObject.getVideoTracks()[0];
});

/* FLASH */
function toggleFlash() {
  if (!track) return;
  torch = !torch;
  track.applyConstraints({ advanced: [{ torch }] });
}
</script>

</body>
</html>
