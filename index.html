<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gate Scanner</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui;
  background:#0b1c2d;
}

.app{
  max-width:420px;
  margin:auto;
  height:100vh;
  background:#fff;
  display:flex;
  flex-direction:column;
}

.header{
  height:50px;
  background:#0b1c2d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.camera{
  flex:1;
  background:#000;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

#reader{
  width:260px;
  height:260px;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
  color:#fff;
}

.valid{background:rgba(25,135,84,.9)}
.used{background:rgba(255,193,7,.9);color:#000}
.invalid{background:rgba(220,53,69,.9)}

.panel{
  padding:10px;
  background:#fff;
}

.stats{
  display:flex;
  gap:6px;
}

.stat{
  flex:1;
  padding:8px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.stat span{
  display:block;
  font-size:18px;
}

.ok{background:#e6f4ea;color:#198754}
.bad{background:#fdecea;color:#dc3545}
.vip{background:#e7f1ff;color:#0d6efd}

.tap{
  margin-top:8px;
  background:#0b1c2d;
  color:#fff;
  padding:10px;
  text-align:center;
  border-radius:10px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">🎟️ Gospel Show Gate</div>

  <div class="camera">
    <div id="reader"></div>
    <div id="overlay" class="overlay"></div>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat ok">Verified<span id="ok">0</span></div>
      <div class="stat bad">Rejected<span id="bad">0</span></div>
      <div class="stat vip">VIP<span id="vip">0</span></div>
    </div>

    <div class="tap" onclick="enableVoice()">🔊 Tap once to enable voice</div>
  </div>
</div>

<script>
/* SUPABASE */
const supabaseClient = supabase.createClient(
  "https://nsmzfsbweutysbdhgjec.supabase.co",
  "sb_publishable_bEvuBN_PM3UdX1ferXyQkg_tR97hhN7"
);

/* VOICE */
let voiceEnabled=false;
function enableVoice(){
  voiceEnabled=true;
  speak("Voice system activated");
}

function speak(text){
  if(!voiceEnabled) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate=0.9;
  speechSynthesis.speak(u);
}

/* UI */
const overlay=document.getElementById("overlay");
function show(type,text){
  overlay.className="overlay "+type;
  overlay.innerText=text;
  overlay.style.display="flex";
  setTimeout(()=>overlay.style.display="none",2200);
}

/* COUNTERS */
let ok=0,bad=0,vip=0;
const okEl=ok=document.getElementById("ok");
const badEl=bad=document.getElementById("bad");
const vipEl=vip=document.getElementById("vip");

/* SAVE COUNTERS */
async function saveStats(v,r,vipCount){
  await supabaseClient
    .from("gate_stats")
    .update({ verified:v, rejected:r, vip:vipCount })
    .eq("id",1);
}

/* LOG */
async function logScan(qr,status,type){
  await supabaseClient
    .from("gate_logs")
    .insert([{ qr_code:qr, status, ticket_type:type, gate_name:"Main Gate" }]);
}

/* SCANNER */
let locked=false;
const scanner=new Html5Qrcode("reader");

scanner.start(
  {facingMode:"environment"},
  {fps:10, qrbox:{width:220,height:220}},
  async text=>{
    if(locked) return;
    locked=true;

    const {data}=await supabaseClient
      .from("tickets")
      .select("*")
      .eq("qr_code",text)
      .single();

    if(!data){
      bad++; badEl.textContent=bad;
      show("invalid","INVALID");
      speak("Invalid ticket");
      await logScan(text,"invalid",null);
      await saveStats(ok,bad,vip);
      return setTimeout(()=>locked=false,3000);
    }

    if(data.used){
      bad++; badEl.textContent=bad;
      show("used","USED");
      speak("Ticket already used");
      await logScan(text,"used",data.type);
      await saveStats(ok,bad,vip);
      return setTimeout(()=>locked=false,3000);
    }

    await supabaseClient
      .from("tickets")
      .update({used:true})
      .eq("id",data.id);

    ok++; okEl.textContent=ok;
    if(data.type==="VIP"){ vip++; vipEl.textContent=vip; }

    show("valid","ACCESS GRANTED");
    speak("Access granted");

    await logScan(text,"valid",data.type);
    await saveStats(ok,bad,vip);

    setTimeout(()=>locked=false,3000);
  }
);
</script>

</body>
</html>
